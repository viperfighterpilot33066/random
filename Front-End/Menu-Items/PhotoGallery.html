<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - I.N IT RUNNING</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: #1f1f1f;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .image-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .image-caption {
            opacity: 1;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            margin: 20px auto;
            text-align: center;
        }

        .lightbox img {
            max-height: 80vh;
            max-width: 100%;
            border-radius: 8px;
        }

        .lightbox-caption {
            color: white;
            margin-top: 15px;
            font-size: 18px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 10px;
            }

            .gallery-item img {
                height: 150px;
            }
        }
        
        .gallery-header {
            text-align: center;
            padding: 40px 20px;
            background: #1f1f1f;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .gallery-header h1 {
            color: white;
            margin: 0;
            font-size: 36px;
        }

        .gallery-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #333;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #4285f4;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <img src="../images/Logo.webp" id="logoImg">
    <button id="menu-button" aria-controls="Menu" aria-expanded="false">☰</button>
    <div class="hidden" id="Menu">
        <ul>
            <li><span id="status">Not logged in</span></li>
            <li><a href="../index.html">Home</a></li>
            <li><a href="MembersPortal.html">Members Portal</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="PhotoGallery.html">Photo Gallery</a></li>
            <li><a href="#">Join Us!</a></li>
        </ul>
    </div>

    <button class="back-button" onclick="window.location.href='MembersPortal.html'">← Back</button>

    <div class="gallery-container">
        <div class="gallery-header">
            <h1>Our Running Moments</h1>
            <div class="gallery-filters">
                <button class="filter-btn active" onclick="filterGallery('all')">All</button>
                <button class="filter-btn" onclick="filterGallery('events')">Events</button>
                <button class="filter-btn" onclick="filterGallery('training')">Training</button>
                <button class="filter-btn" onclick="filterGallery('social')">Social</button>
            </div>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" onclick="closeLightbox()">×</button>
        <div class="lightbox-content">
            <img id="lightbox-image" src="" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <script src="../java.js"></script>
    <script>
        // Sample gallery data with categories
        const galleryItems = [
            {
                src: 'https://images.unsplash.com/photo-1552674605-db6ffd4facb5',
                caption: 'Morning Marathon Training',
                category: 'training',
                date: '2023-12-10'
            },
            {
                src: 'https://images.unsplash.com/photo-1539966903171-89770f33f468',
                caption: 'Weekend Group Run',
                category: 'social',
                date: '2023-12-15'
            },
            {
                src: 'https://images.unsplash.com/photo-1520732713659-8f14034ba7d6',
                caption: 'Annual Running Festival',
                category: 'events',
                date: '2023-11-30'
            },
            {
                src: 'https://images.unsplash.com/photo-1528543606781-2f6e6857f318',
                caption: 'Track Day Training',
                category: 'training',
                date: '2023-12-05'
            },
            {
                src: 'https://images.unsplash.com/photo-1526676037777-05a232554f77',
                caption: 'Team Building Event',
                category: 'social',
                date: '2023-12-01'
            },
            {
                src: 'https://images.unsplash.com/photo-1542103749-8ef59b94f47e',
                caption: 'Winter Run Challenge',
                category: 'events',
                date: '2023-12-20'
            }
        ];

        // Load gallery items
        function loadGallery(filter = 'all') {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';
            
            galleryItems
                .filter(item => filter === 'all' || item.category === filter)
                .forEach(item => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.innerHTML = `
                        <img src="${item.src}" alt="${item.caption}" loading="lazy">
                        <div class="image-caption">
                            <h3>${item.caption}</h3>
                            <p>${item.date}</p>
                        </div>
                    `;
                    galleryItem.onclick = () => openLightbox(item);
                    galleryGrid.appendChild(galleryItem);
                });
        }

        // Filter gallery
        window.filterGallery = function(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadGallery(category);
        };

        // Initialize gallery
        loadGallery();

        // Lightbox functionality
        function openLightbox(item) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxCaption = document.getElementById('lightbox-caption');
            
            lightboxImage.src = item.src;
            lightboxCaption.textContent = item.caption;
            lightbox.style.display = 'block';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Close lightbox when clicking outside the image
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
